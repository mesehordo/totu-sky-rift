# A Python-referenciajáték tesztjei: determinisztikus matematika, mentés, golden replay-ek, HUD.
name: referencia

on:
  push:
    paths: ["rts/**", "data/**", "campaigns/**", "tools/**", "tests/**", "main.py", ".github/workflows/referencia.yml"]
  pull_request:
    paths: ["rts/**", "data/**", "campaigns/**", "tools/**", "tests/**", "main.py", ".github/workflows/referencia.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python-referencia (Linux)
    runs-on: ubuntu-24.04
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pygame-ce==2.5.8 numpy==2.5.4 pillow==13.0.0
      - run: python tools/test_dmath.py
      - run: python tools/test_snapshot.py
      - run: python tools/golden_replays.py
      - run: python tools/test_hud.py
