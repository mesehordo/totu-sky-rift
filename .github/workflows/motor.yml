# Az új C++-motor fordítása és tesztje minden célrendszeren (UJ_MOTOR_TERV.md, M1 kapu).
name: motor

on:
  push:
    paths: ["engine/**", ".github/workflows/motor.yml"]
  pull_request:
    paths: ["engine/**", ".github/workflows/motor.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows x64 (MSVC)", os: windows-latest }
          - { name: "Linux x64 (GCC)", os: ubuntu-24.04 }
          - { name: "macOS arm64 (Apple Silicon)", os: macos-15 }
          - { name: "macOS x64 (Intel)", os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
        with:
          # a motor, egyetlen sprite-lap és a csempekészletek (a kép- és megjelenítőpróbákhoz)
          sparse-checkout: |
            /engine/
            /assets/sprites/units/cro_agyfalo.json
            /assets/sprites/units/cro_agyfalo.png
            /assets/sprites/units/cro_agyfalo_team.png
            /assets/sprites/units/urs_telepes.json
            /assets/sprites/units/urs_telepes.png
            /assets/sprites/units/urs_telepes_team.png
            /assets/sprites/buildings/urs_nagyterem.json
            /assets/sprites/buildings/urs_nagyterem.png
            /assets/sprites/buildings/urs_nagyterem_team.png
            /assets/sprites/resources/
            /assets/sprites/tiles/
            /assets/fonts/egszakadas_rovaskonyv_text.ttf
          sparse-checkout-cone-mode: false
      - name: Linux-függőségek (SDL3 videó- és hangfejlécek)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libdbus-1-dev libudev-dev
      - name: Konfigurálás
        run: cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release -DTOTU_SYSTEM_SDL=OFF
      - name: Fordítás
        run: cmake --build build --config Release --parallel
      - name: Tesztek
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Megjelenítőpróba (Mesa szoftveres OpenGL 3.3, virtuális kijelző)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" \
            ./build/totu --demo 200 --frames 30 --size 960x540 --screenshot kepproba.png --check
          ./build/totu_atlas assets atlasz_ci --only cro_
          ./build/totu_atlas assets atlasz_gazd --only urs_telepes,urs_nagyterem,wood,stone,meteor
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24"             ./build/totu --demo 300 --atlas atlasz_ci --frames 30 --size 960x540 --screenshot kepproba_atlasz.png --check
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" \
            ./build/totu --world engine/tests/data/maps/DEMO-VILAG.json --atlas atlasz_ci --frames 300 --size 960x540 --daytime 0.3 --nofog --screenshot kepproba_vilag.png --check
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" \
            ./build/totu --world engine/tests/data/maps/DEMO-VILAG.json --atlas atlasz_ci --frames 300 --size 960x540 --daytime 0.75 --weather zivatar --screenshot kepproba_vihar.png --check
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" \
            ./build/totu --world engine/tests/data/maps/ECO-ALAP.json --atlas atlasz_gazd --frames 600 --size 960x540 --daytime 0.3 --zoom 1.0 --screenshot kepproba_gazdasag.png --check
      - name: Képernyőkép-összevetés (referenciaképek – Mesa – az engine/tests/data/kepek/ mappában)
        if: runner.os == 'Linux'
        run: |
          fail=0
          for k in kepproba kepproba_atlasz kepproba_vilag kepproba_vihar kepproba_gazdasag; do
            rc=0
            ./build/totu_imgdiff engine/tests/data/kepek/$k.png $k.png --out ${k}_elteres.png || rc=$?
            # 3: még nincs referencia (új próba) – csak jelzés
            if [ $rc -ne 0 ] && [ $rc -ne 3 ]; then fail=1; fi
          done
          exit $fail
      - name: A képpróba képe
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: kepproba-linux
          path: kepproba*.png
          if-no-files-found: ignore

  freebsd:
    name: FreeBSD x64 (clang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /engine/
            /assets/fonts/egszakadas_rovaskonyv_text.ttf
          sparse-checkout-cone-mode: false
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y cmake git pkgconf sdl3
          run: |
            cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --parallel 4
            ctest --test-dir build --output-on-failure

  openbsd:
    name: OpenBSD x64 (clang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /engine/
            /assets/fonts/egszakadas_rovaskonyv_text.ttf
          sparse-checkout-cone-mode: false
      - uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: pkg_add -I cmake git sdl3
          run: |
            cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --parallel 4
            ctest --test-dir build --output-on-failure
